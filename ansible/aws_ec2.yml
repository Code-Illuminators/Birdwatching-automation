plugin: amazon.aws.aws_ec2
regions:
  - us-east-1

filters:
  instance-state-name: running

keyed_groups:
  - key: tags.Name

hostnames:
  - instance-id

compose:
  ansible_connection: community.aws.aws_ssm
  ansible_user: ec2-user
  ansible_aws_ssm_region: us-east-1
  ansible_aws_ssm_s3_bucket: birdwatching-ssm-stage-01